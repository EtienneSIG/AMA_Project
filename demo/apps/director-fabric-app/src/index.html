<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LearnEU — Director Analytics (Fabric)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --line:#dde3ea; --grey:#5a6675; --ink:#0a2540; --teal:#1b9e8a; --navy:#0f1b2d; --orange:#f26334; }
  *{box-sizing:border-box} body { font-family: system-ui, sans-serif; color:var(--ink); margin:0; padding:1rem; background:#f4f7fb; }
  .bar { display:flex; gap:.5rem; align-items:center; margin-bottom:1rem; flex-wrap:wrap; }
  .src { font-size:.72rem; color:var(--grey); margin-left:auto; }
  select,button { padding:.4rem .6rem; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.8rem; margin-bottom:1rem; }
  .kpi { background:#fff; border:1px solid var(--line); border-radius:12px; padding:.9rem 1rem; }
  .kpi .v { font-size:1.7rem; font-weight:700; color:var(--navy); } .kpi .l { font-size:.78rem; color:var(--grey); }
  .kpi .v.pos{color:var(--teal)} .kpi .v.neg{color:var(--orange)}
  .grid { display:grid; grid-template-columns:1.3fr 1fr; gap:1rem; } @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:1rem; margin-bottom:1rem; }
  h2{font-size:1rem;margin:.1rem 0 .8rem} .barrow{display:flex;align-items:center;gap:.6rem;margin:.35rem 0;font-size:.82rem}
  .barrow .nm{width:130px;color:var(--grey)} .barrow .track{flex:1;background:#eef2f7;border-radius:999px;height:.7rem}
  .barrow .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--navy))} .barrow .pct{width:42px;text-align:right;font-weight:600}
  svg{max-width:100%} .dot{fill:var(--orange);opacity:.85} .schoolname{font-size:9px;fill:var(--navy)}
  #map{height:360px;border-radius:10px;overflow:hidden;border:1px solid var(--line);} .leaflet-popup-content{font-family:system-ui,sans-serif;font-size:.84rem}
</style>
</head>
<body>
  <div class="bar"><strong>Director analytics</strong><span class="src" id="src">Fabric · EU</span></div>
  <div class="kpis" id="kpis"></div>
  <div class="grid">
    <div class="card"><h2>Establishment mastery vs national</h2><div id="bars"></div></div>
    <div class="card"><h2>Schools (Netherlands)</h2><div id="map"></div></div>
  </div>
  <div class="card"><h2>Mastery trend (you vs national)</h2><div id="trend"></div></div>
<script>
function scopeToken(){return new URLSearchParams(location.search).get('scope')||''}
async function load(){
  let j; try{ j=await (await fetch('/api/overview',{headers:{'x-scope-context':scopeToken()}})).json(); }catch(e){ document.getElementById('kpis').innerHTML='Unavailable'; return; }
  document.getElementById('src').textContent='Fabric · EU · '+(j.region||'eu');
  const k=j.kpis; document.getElementById('kpis').innerHTML=[
    ['Learners',k.learners,''],['Schools',k.schools,''],['Mastery',Math.round(k.mastery*100)+'%',''],
    ['Engagement',Math.round(k.engagement*100)+'%',''],['Completion',Math.round(k.completion*100)+'%',''],
    ['Attendance',Math.round(k.attendance*100)+'%',''],['Time on task',k.timeOnTaskMin+' min',''],
    ['At-risk',k.atRisk+'%',k.atRisk>20?'neg':'pos'],['Satisfaction',k.satisfaction+'/5',''],
    ['Gap vs national',(k.gapVsNational>=0?'+':'')+k.gapVsNational+' pts',k.gapVsNational>=0?'pos':'neg']
  ].map(x=>`<div class="kpi"><div class="v ${x[2]}">${x[1]}</div><div class="l">${x[0]}</div></div>`).join('');
  const nat=j.national.mastery;
  document.getElementById('bars').innerHTML=j.schools.map(s=>`<div class="barrow"><span class="nm">${s.name}</span><span class="track"><span class="fill" style="width:${Math.round(s.mastery*100)}%"></span></span><span class="pct">${Math.round(s.mastery*100)}%</span></div>`).join('')+`<div class="barrow"><span class="nm">National</span><span class="track"><span class="fill" style="width:${Math.round(nat*100)}%;background:#94a3b8"></span></span><span class="pct">${Math.round(nat*100)}%</span></div>`;
  const W=380,H=300,x=l=>(l-3.2)/(7.3-3.2)*W,y=l=>H-(l-50.7)/(53.7-50.7)*H;
  // Google-Maps-style interactive map (Leaflet + OpenStreetMap tiles).
  if(window.L && !window._lmap){ window._lmap=L.map('map',{scrollWheelZoom:false}).setView([52.2,5.3],7); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:12,attribution:'© OpenStreetMap'}).addTo(window._lmap); window._lmarkers=L.layerGroup().addTo(window._lmap); }
  if(window._lmap){ window._lmarkers.clearLayers(); const grp=[];
    j.schools.forEach(s=>{ const col=s.mastery>=0.65?'#1b9e8a':(s.mastery>=0.6?'#e8a33d':'#f26334');
      const m=L.circleMarker([s.lat,s.lng],{radius:8+s.learners/80,color:'#fff',weight:2,fillColor:col,fillOpacity:0.9});
      m.bindPopup('<strong>'+s.name+'</strong><br>Mastery '+Math.round(s.mastery*100)+'% · '+s.learners+' learners');
      m.addTo(window._lmarkers); grp.push([s.lat,s.lng]); });
    if(grp.length) window._lmap.fitBounds(grp,{padding:[30,30],maxZoom:9}); setTimeout(()=>window._lmap.invalidateSize(),200);
  }
  const tr=j.schools[0]?j.schools[0].trend:[.6,.63,.65],pts=a=>a.map((v,i)=>`${20+i*160},${120-v*120}`).join(' ');
  document.getElementById('trend').innerHTML=`<svg viewBox="0 0 360 130" width="360" height="130"><polyline fill="none" stroke="#1b9e8a" stroke-width="2.5" points="${pts(tr)}"/><polyline fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4" points="${pts(j.nationalTrend)}"/></svg><p class="src">Teal = your scope · grey = national</p>`;
}
load();
</script>
</body>
</html>
