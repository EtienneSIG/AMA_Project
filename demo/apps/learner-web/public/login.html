<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LearnEU — Sign in</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#0F1B2D,#1a3658); font-family:'Inter',sans-serif; padding:1rem; }
  .card { background:#fff; padding:2.2rem 2.4rem; border-radius:14px; width:380px; max-width:100%; box-shadow:0 12px 40px rgba(0,0,0,0.25); box-sizing:border-box; }
  h1 { font-family:'Poppins',sans-serif; color:#0F1B2D; margin:0 0 .25rem; font-size:1.4rem; }
  p.sub { color:#3F4A5A; margin:0 0 1.4rem; font-size:.9rem; }
  label { display:block; font-size:.78rem; color:#3F4A5A; margin:.65rem 0 .2rem; font-weight:600; letter-spacing:.02em; text-transform:uppercase; }
  input { width:100%; padding:.65rem .8rem; border:1px solid #E3E7EE; border-radius:8px; font-family:inherit; font-size:.95rem; box-sizing:border-box; color:#0F1B2D; }
  input:focus { outline:2px solid #2BB4B8; outline-offset:1px; }
  button { width:100%; margin-top:1.2rem; background:#F26334; color:#fff; border:0; padding:.75rem; border-radius:999px; font-weight:600; font-family:inherit; font-size:.95rem; cursor:pointer; }
  button:hover { background:#D44E22; }
  .err { color:#E53E3E; font-size:.82rem; margin-top:.7rem; min-height:1em; }
  .demo { background:#EEF2F7; border-radius:8px; padding:.7rem .85rem; font-size:.75rem; color:#3F4A5A; margin-top:1rem; line-height:1.5; }
  .demo code { font-family:'JetBrains Mono',ui-monospace,monospace; color:#0F1B2D; background:#fff; padding:.05rem .3rem; border-radius:3px; }
  img { display:block; margin:0 auto 1.2rem; height:38px; }
  .lang-pill { display:inline-block; background:rgba(43,180,184,0.15); color:#2BB4B8; padding:.2rem .6rem; border-radius:999px; font-size:.7rem; font-weight:600; letter-spacing:.05em; text-transform:uppercase; margin-bottom:.6rem; }
</style>
<!-- ===== Theme dongle (top-right) — only addition to the existing markup ===== -->
<style>
  /* Dongle is theme-agnostic so it shows in both themes. */
  .theme-dongle { position:fixed; top:16px; right:16px; z-index:50; display:flex; align-items:center; gap:.5rem;
    background:rgba(255,255,255,0.12); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    padding:.35rem .6rem; border-radius:50px; box-shadow:0 2px 6px rgba(0,0,0,0.15); font-family:'Inter',sans-serif; }
  .theme-dongle__label { font-size:.7rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:#fff; user-select:none; }
  .theme-dongle__switch { position:relative; width:42px; height:24px; border:0; border-radius:50px; cursor:pointer;
    background:rgba(255,255,255,0.35); transition:background .2s ease; padding:0; }
  .theme-dongle__switch::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%;
    background:#fff; transition:transform .2s ease; box-shadow:0 1px 2px rgba(0,0,0,0.25); }
  .theme-dongle__switch[aria-checked="true"] { background:#0081c0; }
  .theme-dongle__switch[aria-checked="true"]::after { transform:translateX(18px); }
</style>

<!-- ===== Alternative "Editorial GIC" theme — scoped under body.theme-gic ===== -->
<style>
  /* Display serif fallback (ppmondwest is proprietary; Source Serif 4 stands in). */
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap');

  body.theme-gic {
    /* GIC design tokens */
    --gic-cream:#fefffc; --gic-paper:#ffffff; --gic-linen:#f9faf7;
    --gic-ink:#171717; --gic-carbon:#2c2c2c; --gic-steel:#646464;
    --gic-sage:#dee2de; --gic-iron:#444141; --gic-obsidian:#1f1f29;
    --gic-hudson-blue:#0081c0; --gic-slate-cyan:#41a1cf;
    --gic-font-display:'Source Serif 4','Lora','PT Serif',serif;
    --gic-font-body:'Inter','Söhne',system-ui,sans-serif;
    background:var(--gic-cream);
    font-family:var(--gic-font-body);
    letter-spacing:-0.012em;
  }
  body.theme-gic .card {
    background:var(--gic-paper);
    border:1px solid var(--gic-sage);
    border-radius:16px; /* elevated card */
    box-shadow:0 1px 2px rgba(23,23,23,0.04), 0 8px 24px rgba(23,23,23,0.08);
    padding:2.4rem 2.4rem;
  }
  body.theme-gic h1 {
    font-family:var(--gic-font-display);
    font-weight:500; font-size:2.1rem; line-height:1.1;
    letter-spacing:-0.02em; color:var(--gic-ink);
    font-feature-settings:'liga' 0;
  }
  body.theme-gic p.sub { color:var(--gic-steel); font-size:.95rem; line-height:1.5; }
  body.theme-gic label { color:var(--gic-steel); font-weight:600; font-size:.72rem; letter-spacing:.04em; }
  body.theme-gic input {
    border:1px solid var(--gic-sage); border-radius:4px;
    color:var(--gic-ink); background:var(--gic-paper);
  }
  body.theme-gic input:focus { outline:2px solid var(--gic-slate-cyan); outline-offset:1px; }
  body.theme-gic button {
    background:var(--gic-obsidian); color:var(--gic-paper);
    border-radius:4px; /* content buttons stay at 4px */
    font-weight:600; letter-spacing:-0.01em;
  }
  body.theme-gic button:hover { background:#000; }
  body.theme-gic .demo {
    background:var(--gic-linen); border:1px solid var(--gic-sage);
    border-radius:12px; color:var(--gic-steel);
  }
  body.theme-gic .demo code { background:var(--gic-paper); color:var(--gic-ink); border:1px solid var(--gic-sage); }
  body.theme-gic .demo strong { color:var(--gic-ink); }
  body.theme-gic .lang-pill {
    background:transparent; color:var(--gic-slate-cyan);
    border:1px solid var(--gic-slate-cyan); border-radius:50px;
  }
  body.theme-gic .err { color:#a02b2b; }
  /* Dongle adapts to the light canvas in editorial mode. */
  body.theme-gic .theme-dongle { background:var(--gic-paper); border:1px solid var(--gic-sage); box-shadow:0 1px 2px rgba(23,23,23,0.06); }
  body.theme-gic .theme-dongle__label { color:var(--gic-steel); }
  body.theme-gic .theme-dongle__switch { background:var(--gic-mist,#cfd3cf); }
</style>
</head>
<body>
  <form class="card" onsubmit="return signIn(event)">
    <img src="/logo.svg" alt="EdTech Group" />
    <span class="lang-pill" id="portalPill">Portal</span>
    <h1>Sign in to LearnEU</h1>
    <p class="sub" id="appHint">Use your role-specific account.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required />
    <button type="submit">Sign in</button>
    <div class="err" id="err"></div>
    <div class="demo">
      <strong>Demo accounts</strong> &mdash; password is <code>DemoPass2026!</code> for all.<br>
      Suggested for this portal: <code id="demoEmail">…</code>
    </div>
  </form>
<script>
  const APPS = {
    'app-learner-web-learneu-demo':    { label:'Learner Web (students)',     pill:'For Students',  email:'student@learneu.demo' },
    'app-parent-portal-learneu-demo':  { label:'Parent Portal (families)',   pill:'For Families',  email:'parent@learneu.demo'  },
    'app-teacher-console-learneu-demo':{ label:'Teacher Console (educators)',pill:'For Educators', email:'teacher@learneu.demo' },
    'app-admin-learneu-demo':          { label:'Admin Console (operations)', pill:'For Admins',    email:'admin@learneu.demo'   },
    'app-director-portal-learneu-demo':{ label:'Director Portal (aggregated reporting)', pill:'For Directors', email:'director@learneu.demo' }
  };
  const host = location.host.split('.')[0];
  const meta = APPS[host] || { label:'LearnEU', pill:'LearnEU', email:'admin@learneu.demo' };
  document.getElementById('portalPill').textContent = meta.pill;
  document.getElementById('appHint').textContent = 'You are signing in to ' + meta.label + '.';
  document.getElementById('demoEmail').textContent = meta.email;
  document.getElementById('email').value = meta.email;

  async function signIn(e) {
    e.preventDefault();
    const errEl = document.getElementById('err');
    errEl.textContent = '';
    try {
      // Read CSRF token from cookie
      const csrfToken = (document.cookie.match(/(?:^|;\s*)learneu_csrf=([^;]+)/) || [])[1] || '';
      const r = await fetch('/api/auth/login', {
        method:'POST',
        headers:{'Content-Type':'application/json', 'X-CSRF-Token': csrfToken},
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      if (r.ok) { location.href = '/'; return false; }
      const j = await r.json().catch(()=>({}));
      errEl.textContent = j.error || ('HTTP '+r.status);
    } catch (err) {
      errEl.textContent = String(err);
    }
    return false;
  }
</script>
</body>
</html>
