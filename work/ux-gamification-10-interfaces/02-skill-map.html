<!doctype html>
<html lang="fr"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skill Map</title><link rel="stylesheet" href="common.css" /></head>
<body><div class="shell">
<section class="hero"><h1>Skill Map</h1><p>Explore les iles de competences et debloque les ponts.</p></section>
<section class="card" style="margin-top:16px;">
  <h2>Carte de progression</h2>
  <div class="grid" style="grid-template-columns:repeat(4,minmax(150px,1fr));">
    <div class="card" style="background:#fff7f3;"><h3>Ile 1</h3><p>Fractions bases</p><div class="progress"><span style="width:100%"></span></div></div>
    <div class="card" style="background:#effaf9;"><h3>Ile 2</h3><p>Equivalences</p><div class="progress"><span style="width:74%"></span></div></div>
    <div class="card" style="background:#f0f4fb;"><h3>Ile 3</h3><p>Additions</p><div class="progress"><span style="width:48%"></span></div></div>
    <div class="card" style="background:#fff;"><h3>Ile 4</h3><p>Problemes</p><div class="progress"><span style="width:12%"></span></div></div>
  </div>
</section>
</div></body></html>
